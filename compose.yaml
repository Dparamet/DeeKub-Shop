services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-deekub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-only-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-deekub}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - deekub-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-deekub} -d ${POSTGRES_DB:-deekub}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  deekub-postgres:
